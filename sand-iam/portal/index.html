<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>账户安全</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { margin: 0; background: #f5f5f5; color: #1f1f1f; }
      .panel { max-width: 720px; margin: 24px auto; background: #fff; padding: 24px; border-radius: 12px; }
      h1, h2 { margin: 0 0 8px; }
      section { margin-top: 24px; }
      label { display: block; margin: 12px 0; }
      input { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px; }
      button { margin: 8px 8px 0 0; padding: 8px 12px; border: 1px solid var(--brand, #1677ff); border-radius: 6px; background: var(--brand, #1677ff); color: #fff; cursor: pointer; }
      .hint, .meta, .empty { color: #666; font-size: 14px; }
      .alert { background: #fff4e5; border: 1px solid #f0c36d; padding: 12px; border-radius: 8px; }
      ul { padding-left: 18px; }
      .portal-heading { display: flex; align-items: center; gap: 12px; }
      .brand-logo { width: 40px; height: 40px; object-fit: contain; border-radius: 8px; }
      .portal-links { margin-top: 32px; color: #666; font-size: 14px; }
      .portal-links a { color: inherit; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/app.ts"></script>
  </body>
</html>
