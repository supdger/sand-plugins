[request_definition]
r = sub, dom, obj, act, attrs
[policy_definition]
p = priority, sub, dom, obj, act, cond, eft, pid, vid
[role_definition]
g = _, _, _
[policy_effect]
e = priority(p.eft) || deny
[matchers]
m = r.dom == p.dom && r.obj == p.obj && r.act == p.act && (r.sub == p.sub || g(r.sub, p.sub, r.dom)) && iamCondition(r.attrs, p.cond)
